<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormSubmit test</title>
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px}input,button{width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{background:#2B3BFF;color:#fff;border:0}</style></head>
<body>
<h2>FormSubmit test</h2>
<p>Submit once. You'll land on FormSubmit's own page, which says exactly what happened (activation sent, already active, or an error).</p>
<form action="https://formsubmit.co/hello@hypercard.in" method="POST">
  <input type="hidden" name="_subject" value="Hypercard FormSubmit test">
  <input type="hidden" name="_captcha" value="false">
  <input name="name" placeholder="Name" value="Test">
  <input name="email" type="email" placeholder="Email" required>
  <button type="submit">Send test</button>
</form>
</body></html>
